server {
    listen 8080;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;

    # The dashboard calls a same-origin /api, so the browser needs no CORS.
    location /api/ {
        proxy_pass http://logistics-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Above the API's 5 MB upload cap; driver app APKs are larger.
        client_max_body_size 200m;
        # AI assistant replies can take far longer than the 60s default.
        proxy_read_timeout 300s;
    }

    # Grafana is configured to serve from this sub-path.
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        # Grafana Live uses a websocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    # Vite fingerprints these file names, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes such as /vehicles all load the app shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
