# Local cluster for trying the whole system. Host ports are bound to loopback
# only: this is a dev deployment, so it isn't offered to the LAN.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# Unplugging a USB device (e.g. the Android test phone) leaves a stale entry in
# the node's /dev, and privileged pods such as kube-proxy then can't start.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
      privileged_without_host_devices = true
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080 # logistics-frontend NodePort
        hostPort: 8088
        listenAddress: 127.0.0.1
      - containerPort: 30081 # logistics-api NodePort
        hostPort: 8089
        listenAddress: 127.0.0.1
