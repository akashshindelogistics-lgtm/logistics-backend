apiVersion: v1
kind: Service
metadata:
  name: logistics-frontend
spec:
  type: NodePort
  selector:
    app: logistics-frontend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logistics-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logistics-frontend
  template:
    metadata:
      labels:
        app: logistics-frontend
    spec:
      containers:
        - name: nginx
          image: logistics-frontend:local
          imagePullPolicy: Never # loaded with `kind load`, not in a registry
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-conf
          configMap:
            name: frontend-nginx
